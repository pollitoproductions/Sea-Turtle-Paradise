<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sea Turtle Paradise</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; overflow: hidden; background-color: #021a19; touch-action: none; }
    canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
  </style>
</head>
<body class="relative w-full h-screen overflow-hidden bg-[#021a19]">

  <div class="absolute top-8 right-8 flex flex-col gap-4 z-20 pointer-events-auto">
    <button
      id="waterBtn"
      class="w-12 h-12 rounded-full flex items-center justify-center backdrop-blur-md transition-all duration-300 bg-cyan-500/30 border border-cyan-200 text-white shadow-[0_0_15px_rgba(34,211,238,0.5)] scale-110"
      title="Water Interaction Mode"
    >
      <svg viewBox="0 0 24 24" fill="none" class="w-6 h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M2 12C4 12 5 14 8 14C11 14 13 10 16 10C19 10 20 12 22 12M2 16C4 16 5 18 8 18C11 18 13 14 16 14C19 14 20 16 22 16" />
      </svg>
    </button>
    <button
      id="foodBtn"
      class="w-12 h-12 rounded-full flex items-center justify-center backdrop-blur-md transition-all duration-300 bg-slate-900/50 border border-slate-600 text-green-300 hover:bg-slate-800/60 shadow-lg"
      title="Feeding Mode"
    >
      <svg viewBox="0 0 24 24" fill="none" class="w-8 h-8">
        <circle cx="12" cy="12" r="10" fill="#134d24" stroke="#0a2e12" stroke-width="0.5"/>
        <circle cx="12" cy="12" r="8.5" fill="#7dce94" />
        <circle cx="12" cy="12" r="7" fill="#e2f5e6" />
        <path d="M12 12 Q 15 8 16 12 Q 15 16 12 12" fill="#b6e3c4" transform="rotate(0 12 12)"/>
        <path d="M12 12 Q 15 8 16 12 Q 15 16 12 12" fill="#b6e3c4" transform="rotate(120 12 12)"/>
        <path d="M12 12 Q 15 8 16 12 Q 15 16 12 12" fill="#b6e3c4" transform="rotate(240 12 12)"/>
        <ellipse cx="14" cy="11.5" rx="0.8" ry="0.4" fill="#fff" transform="rotate(30 14 11.5)"/>
        <ellipse cx="14" cy="12.5" rx="0.8" ry="0.4" fill="#fff" transform="rotate(-30 14 12.5)"/>
        <ellipse cx="10" cy="10" rx="0.8" ry="0.4" fill="#fff" transform="rotate(150 10 10)"/>
        <ellipse cx="11" cy="9" rx="0.8" ry="0.4" fill="#fff" transform="rotate(90 11 9)"/>
        <ellipse cx="10" cy="14" rx="0.8" ry="0.4" fill="#fff" transform="rotate(210 10 14)"/>
        <ellipse cx="11" cy="15" rx="0.8" ry="0.4" fill="#fff" transform="rotate(270 11 15)"/>
      </svg>
    </button>
    <button
      id="muteBtn"
        class="w-12 h-12 rounded-full flex items-center justify-center backdrop-blur-md transition-all duration-300 bg-slate-900/50 border border-slate-600 text-white hover:bg-slate-800/60 shadow-lg"
        title="Toggle Water Sound"
        aria-label="Toggle Water Sound"
    >
      <svg viewBox="0 0 24 24" fill="none" class="w-6 h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 5L6 9H3v6h3l5 4V5z" />
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
        <path d="M19.07 5.93a9 9 0 0 1 0 12.73" />
        <path id="muteSlash" d="M4 4l16 16" />
      </svg>
    </button>
    <button
      id="dayNightBtn"
      class="w-12 h-12 rounded-full flex items-center justify-center backdrop-blur-md transition-all duration-300 bg-slate-900/50 border border-slate-600 text-white hover:bg-slate-800/60 shadow-lg"
      title="Toggle Day/Night"
      aria-label="Toggle Day/Night"
    >
      <svg viewBox="0 0 24 24" fill="none" class="w-6 h-6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10" />
        <path d="M12 2 A 5 5 0 0 1 12 12 A 5 5 0 0 0 12 22" />
        <circle cx="7" cy="7" r="1.5" fill="currentColor" stroke="none" />
        <path d="M7 3.5v1M7 9.5v1M3.5 7h1M9.5 7h1M4.5 4.5l.7.7M9.5 9.5l-.7-.7M9.5 4.5l-.7.7M4.5 9.5l.7-.7" />
        <path d="M17.5 14.5 A 2.5 2.5 0 1 0 19.5 18.5 A 3 3 0 1 1 17.5 14.5 Z" fill="currentColor" stroke="none" />
      </svg>
    </button>
  </div>

  <canvas id="oceanCanvas"></canvas>

  <script>
    // --- State Management (Replacing React useState/useRef) ---
    const canvas = document.getElementById('oceanCanvas');
    const ctx = canvas.getContext('2d');


    // Always match canvas internal resolution to visible size to prevent stretching.
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      canvas.style.width = `${window.innerWidth}px`;
      canvas.style.height = `${window.innerHeight}px`;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let mode = 'water'; // 'water' or 'food'
    const waterBtn = document.getElementById('waterBtn');
    const foodBtn = document.getElementById('foodBtn');
    const muteBtn = document.getElementById('muteBtn');
    const dayNightBtn = document.getElementById('dayNightBtn');

    // Theme: 'night' uses existing background, 'day' uses light teal
    let theme = 'night';

    function updateThemeUI() {
      if (theme === 'night') {
        document.body.style.backgroundColor = '#021a19';
        canvas.style.backgroundColor = 'transparent';
        dayNightBtn.className = "w-12 h-12 rounded-full flex items-center justify-center backdrop-blur-md transition-all duration-300 bg-slate-900/50 border border-slate-600 text-white hover:bg-slate-800/60 shadow-lg";
      } else {
        document.body.style.backgroundColor = '#008080'; // deep teal day body background
        canvas.style.backgroundColor = 'transparent';
        dayNightBtn.className = "w-12 h-12 rounded-full flex items-center justify-center backdrop-blur-md transition-all duration-300 bg-teal-200 border border-teal-300 text-white shadow-[0_0_10px_rgba(56,189,248,0.25)] scale-110";
      }
    }

    dayNightBtn.addEventListener('click', () => {
      theme = theme === 'night' ? 'day' : 'night';
      updateThemeUI();
    });

    // --- Water sound (soft river) audio ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let brownSource = null;
    let gainNode = null;
    let isMuted = true;

    // Create a looping buffer that blends smooth, filtered noise to resemble a soft river
    function createBrownNoiseBuffer(duration = 4) {
      const sampleRate = audioCtx.sampleRate;
      const bufferSize = sampleRate * duration;
      const buffer = audioCtx.createBuffer(2, bufferSize, sampleRate);

      // Two channels with less smoothing and more high-frequency content
      for (let ch = 0; ch < 2; ch++) {
        const data = buffer.getChannelData(ch);
        let last = 0;
        // reduce smoothing to allow more high-frequency energy (shower-like)
        const smooth = 0.008 + Math.random() * 0.006 + (ch * 0.001);
        const phaseOffset = Math.random() * Math.PI * 2;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          last = last + smooth * (white - last);
          // faster, slightly stronger modulation to emulate steady spray
          const t = i / sampleRate;
          const mod = 0.95 + 0.06 * Math.sin(2 * Math.PI * 0.6 * t + phaseOffset) + 0.03 * Math.sin(2 * Math.PI * 2.2 * t);
          // add a bit more HF sparkle to simulate water hitting surfaces
          data[i] = last * 0.6 * mod + (Math.random() * 2 - 1) * 0.018;
        }
      }
      return buffer;
    }

    function startBrownNoise() {
      if (brownSource) return;
      gainNode = audioCtx.createGain();
      // slightly louder than the soft river, tuned for sink/shower clarity
      gainNode.gain.value = 0.08;
      gainNode.connect(audioCtx.destination);

      // gentle highpass to remove mud, then a mild band character for surface sparkle
      const highpass = audioCtx.createBiquadFilter();
      highpass.type = 'highpass';
      highpass.frequency.value = 300; // cut low rumble for a clearer shower tone
      highpass.Q.value = 0.8;

      const band = audioCtx.createBiquadFilter();
      band.type = 'bandpass';
      band.frequency.value = 2500; // emphasize brighter surface spray
      band.Q.value = 1.2;

      // gentle lowpass to control extreme HF but keep shower shimmer
      const lowpass = audioCtx.createBiquadFilter();
      lowpass.type = 'lowpass';
      lowpass.frequency.value = 6000;
      lowpass.Q.value = 0.7;

      // add a subtle high-shelf boost for metallic/shower sparkle
      const highShelf = audioCtx.createBiquadFilter();
      highShelf.type = 'highshelf';
      highShelf.frequency.value = 7000;
      highShelf.gain.value = 6;

      brownSource = audioCtx.createBufferSource();
      brownSource.buffer = createBrownNoiseBuffer(4);
      brownSource.loop = true;

      // slight stereo spread: create splitter + merger and offset channels with tiny delay
      const splitter = audioCtx.createChannelSplitter(2);
      const merger = audioCtx.createChannelMerger(2);

      brownSource.connect(splitter);


      const delayL = audioCtx.createDelay();
      const delayR = audioCtx.createDelay();
      delayL.delayTime.value = 0.0;
      delayR.delayTime.value = 0.005; // small offset for tighter stereo spray

      splitter.connect(delayL, 0);
      splitter.connect(delayR, 1);

      delayL.connect(band);
      delayR.connect(band);

      band.connect(lowpass);
      lowpass.connect(highpass);
      highpass.connect(highShelf);
      highShelf.connect(gainNode);

      brownSource.start();
    }

    function stopBrownNoise() {
      if (!brownSource) return;
      try {
        brownSource.stop();
      } catch (e) {}
      brownSource.disconnect();
      gainNode.disconnect();
      brownSource = null;
      gainNode = null;
    }

    function updateMuteUI() {
      if (isMuted) {
        muteBtn.classList.remove('text-green-300');
        muteBtn.classList.add('text-white');
        muteBtn.querySelector('#muteSlash').style.display = 'block';
      } else {
        muteBtn.classList.remove('text-white');
        muteBtn.classList.add('text-green-300');
        muteBtn.querySelector('#muteSlash').style.display = 'none';
      }
    }

    muteBtn.addEventListener('click', () => {
      if (isMuted) {
        startBrownNoise();
      } else {
        stopBrownNoise();
      }
      isMuted = !isMuted;
      updateMuteUI();
    });

    updateMuteUI();

    function handleVisibilityChange() {
      if (document.hidden) {
        if (!isMuted) {
          stopBrownNoise();
          isMuted = true;
          updateMuteUI();
        }
      }
    }

    document.addEventListener('visibilitychange', handleVisibilityChange);
    window.addEventListener('blur', handleVisibilityChange);
    window.addEventListener('pagehide', handleVisibilityChange);

    const gameState = {
      food: [],
      waves: [],
      pointerActive: false,
      lastX: 0,
      lastY: 0
    };

    // --- UI Update Logic ---
    function updateUI() {
      if (mode === 'water') {
        waterBtn.className = "w-12 h-12 rounded-full flex items-center justify-center backdrop-blur-md transition-all duration-300 bg-cyan-500/30 border border-cyan-200 text-white shadow-[0_0_15px_rgba(34,211,238,0.5)] scale-110";
        foodBtn.className = "w-12 h-12 rounded-full flex items-center justify-center backdrop-blur-md transition-all duration-300 bg-slate-900/50 border border-slate-600 text-green-300 hover:bg-slate-800/60 shadow-lg";
      } else {
        foodBtn.className = "w-12 h-12 rounded-full flex items-center justify-center backdrop-blur-md transition-all duration-300 bg-green-500/30 border border-green-200 text-white shadow-[0_0_15px_rgba(74,222,128,0.5)] scale-110";
        waterBtn.className = "w-12 h-12 rounded-full flex items-center justify-center backdrop-blur-md transition-all duration-300 bg-slate-900/50 border border-slate-600 text-cyan-200 hover:bg-slate-800/60 shadow-lg";
      }
    }

    waterBtn.addEventListener('click', () => { mode = 'water'; updateUI(); });
    foodBtn.addEventListener('click', () => { mode = 'food'; updateUI(); });

    // --- Setup & Sizing ---

    // (Removed duplicate resizeCanvas event listener; now handled above)

    // --- Data Definitions ---
    const numParticles = 150;
    const particles = Array.from({ length: numParticles }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      size: Math.random() * 2 + 0.5,
      speed: Math.random() * 0.5 + 0.1,
      offset: Math.random() * Math.PI * 2,
      alpha: Math.random() * 0.3 + 0.05
    }));

    const numSparkles = 250;
    const sparkles = Array.from({ length: numSparkles }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      size: Math.random() * 1.0 + 0.3,
      phase: Math.random() * Math.PI * 2,
      twinkleSpeed: Math.random() * 0.002 + 0.001
    }));

    const PALETTES = {
      darkTeal: { backFinBase: '#178a84', backFinShadow: '#002020', neck: '#145c5c', headHi: '#8cdada', headMid: '#3bbdb8', headShad: '#003d3d', beak: '#001a1a', frontFinInner: '#003838', frontFinMid: '#3bbdb8', frontFinTip: '#002020', shellPeak: '#8cdada', shellMid: '#3bbdb8', shellBase: '#178a84', shellRim: '#003d3d' },
      babyBlue: { backFinBase: '#a0c8e8', backFinShadow: '#305070', neck: '#608eb0', headHi: '#e0f0ff', headMid: '#80b8e0', headShad: '#407090', beak: '#1a3040', frontFinInner: '#407090', frontFinMid: '#80b8e0', frontFinTip: '#305070', shellPeak: '#e0f0ff', shellMid: '#80b8e0', shellBase: '#6098c0', shellRim: '#407090' },
      cucumberGreen: { backFinBase: '#a8d8a8', backFinShadow: '#306030', neck: '#68a868', headHi: '#e0ffe0', headMid: '#80c880', headShad: '#408040', beak: '#1a401a', frontFinInner: '#408040', frontFinMid: '#80c880', frontFinTip: '#306030', shellPeak: '#e0ffe0', shellMid: '#80c880', shellBase: '#68b868', shellRim: '#408040' },
      lightTeal: { backFinBase: '#48d1cc', backFinShadow: '#004c4c', neck: '#20b2aa', headHi: '#e0ffff', headMid: '#afeeee', headShad: '#008080', beak: '#004040', frontFinInner: '#008080', frontFinMid: '#afeeee', frontFinTip: '#004c4c', shellPeak: '#e0ffff', shellMid: '#afeeee', shellBase: '#48d1cc', shellRim: '#008080' },
      kempsRidley: { backFinBase: '#92a38b', backFinShadow: '#62735b', neck: '#92a38b', headHi: '#d5e6cf', headMid: '#a8ba9f', headShad: '#74876c', beak: '#3f4a39', frontFinInner: '#62735b', frontFinMid: '#92a38b', frontFinTip: '#53634c', shellPeak: '#c9d9c2', shellMid: '#92a38b', shellBase: '#798a72', shellRim: '#53634c' },
      greenSeaTurtle: { backFinBase: '#5c8a5c', backFinShadow: '#2d4d2d', neck: '#6b996b', headHi: '#d9edd9', headMid: '#7ab37a', headShad: '#3d663d', beak: '#263326', frontFinInner: '#3d663d', frontFinMid: '#7ab37a', frontFinTip: '#2d4d2d', shellPeak: '#cce6cc', shellMid: '#5c8a5c', shellBase: '#3d663d', shellRim: '#1f331f' }
    };

    // Helper to reset turtle positions after resize/orientation
    function resetTurtlePositions() {
      const width = canvas.width;
      const height = canvas.height;
      turtles.forEach(t => {
        t.x = Math.random() * width;
        t.y = Math.random() * height;
      });
      sparkles.forEach(s => {
        s.x = Math.random() * width;
        s.y = Math.random() * height;
      });
    }

    const turtles = [
      { scaleMult: 1.0, timeOffset: 0, palette: PALETTES.darkTeal },
      { scaleMult: 0.65, timeOffset: 1500, palette: PALETTES.babyBlue },
      { scaleMult: 0.55, timeOffset: 5000, palette: PALETTES.cucumberGreen },
      { scaleMult: 0.8, timeOffset: 3200, palette: PALETTES.lightTeal },
      { scaleMult: 0.45, timeOffset: 7000, palette: PALETTES.babyBlue },
      { scaleMult: 0.75, timeOffset: 2100, palette: PALETTES.darkTeal },
      { scaleMult: 0.5, timeOffset: 8500, palette: PALETTES.lightTeal },
      { scaleMult: 0.6, timeOffset: 4100, palette: PALETTES.cucumberGreen },
      { scaleMult: 0.32, timeOffset: 1200, palette: PALETTES.babyBlue, isBaby: true },
      { scaleMult: 0.28, timeOffset: 2400, palette: PALETTES.cucumberGreen, isBaby: true },
      { scaleMult: 0.30, timeOffset: 3600, palette: PALETTES.lightTeal, isBaby: true },
      { scaleMult: 0.25, timeOffset: 4800, palette: PALETTES.darkTeal, isBaby: true },
      { scaleMult: 0.35, timeOffset: 6000, palette: PALETTES.babyBlue, isBaby: true },
      { scaleMult: 0.48, timeOffset: 9200, palette: PALETTES.kempsRidley },
      { scaleMult: 0.45, timeOffset: 10500, palette: PALETTES.kempsRidley },
      { scaleMult: 0.50, timeOffset: 11800, palette: PALETTES.kempsRidley },
      { scaleMult: 0.85, timeOffset: 13000, palette: PALETTES.greenSeaTurtle, hasSpots: true },
      { scaleMult: 0.80, timeOffset: 14500, palette: PALETTES.greenSeaTurtle },
      { scaleMult: 0.75, timeOffset: 16000, palette: PALETTES.greenSeaTurtle }
    ].map(t => {
      const spd = t.isBaby ? (1.2 + Math.random() * 0.8) * t.scaleMult : (0.4 + Math.random() * 0.5) * t.scaleMult;
      return {
        ...t,
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        angle: Math.random() * Math.PI * 2,
        targetAngle: Math.random() * Math.PI * 2,
        speed: spd,
        baseSpeed: spd
        ,offscreenTime: 0
      };
    });

    window.addEventListener('resize', () => {
      resetTurtlePositions();
    });

    // --- Drawing Helper Functions ---
    const drawShadow = (ctx) => {
      ctx.save();
      ctx.translate(80, 100);
      ctx.scale(1, 1.15);
      ctx.beginPath();
      ctx.arc(0, 0, 150, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0, 5, 15, 0.4)';
      ctx.filter = 'blur(40px)';
      ctx.fill();
      ctx.restore();
    };

    // Helper to calculate a point on a cubic bezier curve for perfect edge tracing
    const getBezierPoint = (t, p0, p1, p2, p3) => {
      const cT = 1 - t;
      return (Math.pow(cT, 3) * p0) + (3 * Math.pow(cT, 2) * t * p1) + (3 * cT * Math.pow(t, 2) * p2) + (Math.pow(t, 3) * p3);
    };

    const drawBackFlippers = (ctx, time, palette, hasSpots = false) => {
      const sweep = Math.sin(time * 0.002 - Math.PI / 4);
      for (const side of [-1, 1]) {
        ctx.save();
        ctx.translate(side * 50, 120);
        ctx.rotate(side * (-sweep * 0.15 - 0.1));
        
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(side * 50, 20, side * 70, 90, side * 40, 120);
        ctx.bezierCurveTo(side * 10, 100, side * -10, 40, 0, 0);
        const grad = ctx.createLinearGradient(0, 0, side * 40, 120);
        grad.addColorStop(0, palette.backFinBase);
        grad.addColorStop(1, palette.backFinShadow);
        ctx.fillStyle = grad;
        ctx.fill();
        
        ctx.clip();
        // Use the turtle's own shadow color for perfectly blended spots
        ctx.fillStyle = palette.headShad; 
        
        // Outer edge spots
        for (let i = 1; i <= 8; i++) {
          const t = i / 9;
          const px = getBezierPoint(t, 0, side * 50, side * 70, side * 40);
          const py = getBezierPoint(t, 0, 20, 90, 120);
          const r = 2.5 + t * 2.0;
          ctx.beginPath();
          for (let j = 0; j < 6; j++) {
            const angle = (Math.PI * 2 / 6) * j + (i * side);
            // Use math to create a stable but irregular, blocky scale shape
            const dist = r * (0.6 + 0.5 * Math.abs(Math.sin(i * 3 + j * 5)));
            const sx = px - side * 5 + Math.cos(angle) * dist;
            const sy = py + Math.sin(angle) * dist;
            if (j === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
          }
          ctx.fill();
        }
        
        // Inner edge spots
        for (let i = 1; i <= 7; i++) {
          const t = i / 8;
          const px = getBezierPoint(t, side * 40, side * 10, side * -10, 0);
          const py = getBezierPoint(t, 120, 100, 40, 0);
          const r = 1.5 + (1-t) * 1.5;
          ctx.beginPath();
          for (let j = 0; j < 5; j++) {
            const angle = (Math.PI * 2 / 5) * j + (i * 1.2 * side);
            const dist = r * (0.6 + 0.5 * Math.abs(Math.sin(i * 4 + j * 2)));
            const sx = px + side * 5 + Math.cos(angle) * dist;
            const sy = py - 3 + Math.sin(angle) * dist;
            if (j === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
          }
          ctx.fill();
        }

        // Interior / Middle spots
        for (let u of [0.35, 0.65]) {
          const count = u === 0.35 ? 7 : 6;
          for (let i = 1; i <= count; i++) {
            const t = (i + (u === 0.35 ? 0 : 0.5)) / (count + 1);
            if (t >= 1.0) continue;
            
            const pxOut = getBezierPoint(t, 0, side * 50, side * 70, side * 40);
            const pyOut = getBezierPoint(t, 0, 20, 90, 120);
            const pxIn = getBezierPoint(1-t, side * 40, side * 10, side * -10, 0);
            const pyIn = getBezierPoint(1-t, 120, 100, 40, 0);

            // Interpolate perfectly between the outer and inner curves
            const px = pxOut + (pxIn - pxOut) * u;
            const py = pyOut + (pyIn - pyOut) * u;
            const r = 2.5 + Math.sin(t * Math.PI) * 2.5; 

            ctx.beginPath();
            for (let j = 0; j < 5; j++) {
              const angle = (Math.PI * 2 / 5) * j + (i * side * u);
              const dist = r * (0.7 + 0.4 * Math.abs(Math.sin(i * 3 + j * 2 + u * 10)));
              const sx = px + Math.cos(angle) * dist;
              const sy = py + Math.sin(angle) * dist;
              if (j === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
            }
            ctx.fill();
          }
        }
        
        ctx.restore();
      }
    };

    const drawHead = (ctx, time, palette) => {
      const nod = Math.sin(time * 0.001) * 0.04;
      ctx.save();
      ctx.translate(0, -135);
      ctx.rotate(nod);
      
      ctx.beginPath();
      ctx.moveTo(-25, 20); ctx.lineTo(25, 20); ctx.lineTo(20, -20); ctx.lineTo(-20, -20);
      ctx.fillStyle = palette.neck;
      ctx.fill();

      ctx.beginPath();
      ctx.ellipse(0, -30, 32, 42, 0, 0, Math.PI * 2);
      const headGrad = ctx.createRadialGradient(-10, -40, 5, 0, -30, 42);
      headGrad.addColorStop(0, palette.headHi);
      headGrad.addColorStop(0.6, palette.headMid);
      headGrad.addColorStop(1, palette.headShad);
      ctx.fillStyle = headGrad;
      ctx.fill();

      for (const side of [-1, 1]) {
        ctx.beginPath();
        ctx.ellipse(side * 24, -38, 4, 7, side * 0.2, 0, Math.PI * 2);
        ctx.fillStyle = '#080808';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(side * 23, -40, 1.5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.fill();
      }

      ctx.beginPath();
      ctx.moveTo(-12, -68); ctx.lineTo(12, -68); ctx.lineTo(0, -82);
      ctx.fillStyle = palette.beak;
      ctx.fill();
      ctx.restore();
    };

    const drawFrontFlippers = (ctx, time, palette, hasSpots = false) => {
      const sweep = Math.sin(time * 0.0015);
      const flex = Math.cos(time * 0.0015);
      for (const side of [-1, 1]) {
        ctx.save();
        ctx.translate(side * 75, -50);
        ctx.rotate(side * (sweep * 0.25 + 0.15));
        
        const cp1x = side * 90, cp1y = -20;
        const cp2x = side * 200 + flex * 15, cp2y = 30 + sweep * 25;
        const endX = side * 240, endY = 130;
        
        const cp3x = side * 150, cp3y = 110;
        const cp4x = side * 50, cp4y = 70;
        const startX2 = 0, startY2 = 50;

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, endX, endY);
        ctx.bezierCurveTo(cp3x, cp3y, cp4x, cp4y, startX2, startY2);
        ctx.closePath();

        const grad = ctx.createLinearGradient(0, -20, side * 240, 130);
        grad.addColorStop(0, palette.frontFinInner);
        grad.addColorStop(0.4, palette.frontFinMid);
        grad.addColorStop(1, palette.frontFinTip);
        ctx.fillStyle = grad;
        ctx.fill();

        ctx.clip();
        // Use the turtle's own shadow color for perfectly blended spots
        ctx.fillStyle = palette.headShad;

        // Leading edge spots
        for (let i = 1; i <= 15; i++) {
          const t = i / 16;
          const px = getBezierPoint(t, 0, cp1x, cp2x, endX);
          const py = getBezierPoint(t, 0, cp1y, cp2y, endY);
          const r = 2.5 + t * 3.5;
          ctx.beginPath();
          for(let j = 0; j < 6; j++) {
            const angle = (Math.PI * 2 / 6) * j + (i * 0.5 * side);
            const dist = r * (0.6 + 0.5 * Math.abs(Math.sin(i * 7 + j * 3)));
            const sx = px - side * 6 + Math.cos(angle) * dist;
            const sy = py + 6 + Math.sin(angle) * dist;
            if (j === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
          }
          ctx.fill();
        }

        // Trailing edge spots
        for (let i = 1; i <= 13; i++) {
          const t = i / 14;
          const px = getBezierPoint(t, endX, cp3x, cp4x, startX2);
          const py = getBezierPoint(t, endY, cp3y, cp4y, startY2);
          const r = 2 + t * 2; 
          ctx.beginPath();
          for(let j = 0; j < 5; j++) {
            const angle = (Math.PI * 2 / 5) * j + (i * 0.8 * side);
            const dist = r * (0.6 + 0.5 * Math.abs(Math.sin(i * 4 + j * 2)));
            const sx = px - side * 2 + Math.cos(angle) * dist;
            const sy = py - 6 + Math.sin(angle) * dist;
            if (j === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
          }
          ctx.fill();
        }

        // Interior / Middle veins
        const numVeins = 3;
        for (let v = 1; v <= numVeins; v++) {
          const u = v / (numVeins + 1); 
          const spotCount = 15 - Math.abs(v - 2) * 3; 
          for (let i = 1; i <= spotCount; i++) {
            // Offset the rows slightly so they interlock
            const t = (i + (v % 2) * 0.5) / (spotCount + 1);
            if (t >= 1.0) continue;

            const px1 = getBezierPoint(t, 0, cp1x, cp2x, endX);
            const py1 = getBezierPoint(t, 0, cp1y, cp2y, endY);
            const px2 = getBezierPoint(1-t, endX, cp3x, cp4x, startX2);
            const py2 = getBezierPoint(1-t, endY, cp3y, cp4y, startY2);

            // Interpolate perfectly between the leading and trailing edges
            const px = px1 + (px2 - px1) * u;
            const py = py1 + (py2 - py1) * u;
            // Make spots larger in the thick middle section of the flipper
            const r = 2.5 + Math.sin(t * Math.PI) * 4.5; 

            ctx.beginPath();
            for(let j = 0; j < 6; j++) {
              const angle = (Math.PI * 2 / 6) * j + (i * 0.6 * side * u);
              const dist = r * (0.7 + 0.4 * Math.abs(Math.sin(i * 5 + j * 3 + v * 7)));
              const sx = px + Math.cos(angle) * dist;
              const sy = py + Math.sin(angle) * dist;
              if (j === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
            }
            ctx.fill();
          }
        }
        
        ctx.restore();
      }
    };

    const drawShell = (ctx, time, palette) => {
      ctx.save();
      ctx.beginPath();
      ctx.scale(1, 1.18);
      ctx.arc(0, 0, 135, 0, Math.PI * 2);
      ctx.restore();

      const shellGrad = ctx.createRadialGradient(-30, -30, 20, 0, 0, 155);
      shellGrad.addColorStop(0, palette.shellPeak);
      shellGrad.addColorStop(0.3, palette.shellMid);
      shellGrad.addColorStop(0.7, palette.shellBase);
      shellGrad.addColorStop(1, palette.shellRim);
      
      ctx.fillStyle = shellGrad;
      ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
      ctx.shadowBlur = 15;
      ctx.fill();
      ctx.shadowBlur = 0;

      // Added explicit dark stroke to ensure shading around the edges of all shells
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(0, 15, 5, 0.5)';
      ctx.stroke();

      for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.ellipse(0, i * 45, 40 - Math.abs(i) * 6, 28, 0, 0, Math.PI * 2);
        const hGrad = ctx.createLinearGradient(0, i * 45 - 28, 0, i * 45 + 28);
        hGrad.addColorStop(0, 'rgba(255, 255, 255, 0.15)');
        hGrad.addColorStop(1, 'rgba(0, 0, 0, 0.25)');
        ctx.fillStyle = hGrad;
        ctx.fill();
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
        ctx.stroke();
      }

      for (const side of [-1, 1]) {
        for (let i = -1.5; i <= 1.5; i++) {
          ctx.beginPath();
          ctx.ellipse(side * 60, i * 50, 28, 40, side * 0.2, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
          ctx.fill();
          ctx.stroke();
        }
      }

      ctx.save();
      ctx.globalCompositeOperation = 'overlay';
      ctx.beginPath();
      ctx.scale(1, 1.18);
      ctx.arc(0, 0, 135, 0, Math.PI * 2);
      ctx.restore();
      ctx.clip();

      const cTime = time * 0.001;
      ctx.fillStyle = 'rgba(160, 220, 255, 0.15)';
      for (let i = 0; i < 6; i++) {
        ctx.beginPath();
        ctx.arc(
          Math.sin(cTime + i) * 80,
          Math.cos(cTime * 0.8 + i * 2) * 100,
          40 + Math.sin(i) * 20,
          0, Math.PI * 2
        );
        ctx.fill();
      }
      ctx.restore();
    };

    const drawRealisticTurtle = (ctx, globalTime, width, height, t) => {
      const time = globalTime + t.timeOffset;
      const hoverY = Math.sin(time * 0.001) * 10;
      const hoverX = Math.cos(time * 0.0008) * 10;
      const swimWobble = Math.sin(time * 0.0015) * 0.08;

      ctx.save();
      ctx.translate(t.x + hoverX, t.y + hoverY);
      ctx.rotate(t.angle + Math.PI / 2 + swimWobble);

      // Use the minimum of width and height for scaling to prevent stretching
      const scale = Math.min(1, Math.min(width, height) / 900) * 0.5 * t.scaleMult;
      ctx.scale(scale, scale);

      drawShadow(ctx);
      drawBackFlippers(ctx, time, t.palette, t.hasSpots);
      drawHead(ctx, time, t.palette);
      drawFrontFlippers(ctx, time, t.palette, t.hasSpots);
      drawShell(ctx, time, t.palette);

      ctx.restore();
    };

    // --- Main Render Loop ---
    let lastTime = 0;
    function render(time) {
      const dt = lastTime ? Math.min((time - lastTime) / 16.6667, 4) : 1;
      lastTime = time;
      const { width, height } = canvas;

      // 1. Background
      const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
      if (theme === 'night') {
        bgGrad.addColorStop(0, '#023838'); 
        bgGrad.addColorStop(1, '#000f0f'); 
      } else {
        bgGrad.addColorStop(0, '#008b8b'); 
        bgGrad.addColorStop(1, '#003333'); 
      }
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, width, height);

      // 1.1 Vignette Shading (Day Mode Only)
      if (theme === 'day') {
        ctx.save();
        const vignetteGrad = ctx.createRadialGradient(
          width / 2, height / 2, Math.min(width, height) * 0.3,
          width / 2, height / 2, Math.max(width, height) * 0.8
        );
        vignetteGrad.addColorStop(0, 'rgba(0,0,0,0)');
        vignetteGrad.addColorStop(1, 'rgba(0, 20, 20, 0.4)'); // Dark teal/black edge shadow
        ctx.fillStyle = vignetteGrad;
        ctx.fillRect(0, 0, width, height);
        ctx.restore();
      }

      // 1.5 Sparkles (Sun glimmers)
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      sparkles.forEach(s => {
        // Calculate twinkle alpha based on time and phase
        const alpha = (Math.sin(time * s.twinkleSpeed + s.phase) + 1) * 0.5 * 0.95;
        if (alpha > 0.05) {
          ctx.fillStyle = `rgba(255, 215, 0, ${alpha})`;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
          ctx.fill();
        }
      });
      ctx.restore();

      // 2. God Rays
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      const rayTime = time * 0.0003;
      for (let i = 0; i < 7; i++) {
        const offset = Math.sin(rayTime + i * 1.5) * 250;
        const alpha = (Math.sin(rayTime * 3 + i) + 1) * 0.02 + 0.01;
        ctx.fillStyle = `rgba(100, 200, 255, ${alpha})`;
        ctx.beginPath();
        ctx.moveTo(width / 2 - 400 + offset, -100);
        ctx.lineTo(width / 2 + 400 + offset, -100);
        ctx.lineTo(width / 2 + 1000 + offset * 2, height + 100);
        ctx.lineTo(width / 2 - 1000 + offset * 2, height + 100);
        ctx.fill();
      }
      ctx.restore();

      // 3. Food
      gameState.food.forEach(f => {
        f.size += (f.targetSize - f.size) * 0.1 * dt;
        
        ctx.save();
        ctx.translate(f.x, f.y);
        ctx.rotate(f.rot);
        
        // Enhanced Drop Shadow for Depth
        ctx.shadowColor = 'rgba(0, 15, 30, 0.7)'; // Darker, richer shadow
        ctx.shadowBlur = 8;
        ctx.shadowOffsetY = 4;

        // Richer, more contrasting rind gradient
        const rindGrad = ctx.createRadialGradient(-f.size*0.2, -f.size*0.2, f.size * 0.4, 0, 0, f.size);
        rindGrad.addColorStop(0, '#2d6a3c'); // Lighter green highlight on the edge
        rindGrad.addColorStop(0.6, '#143d1f'); // Mid-tone dark green
        rindGrad.addColorStop(1, '#051709'); // Very dark, almost black green for the shadowed edge
        ctx.fillStyle = rindGrad;
        ctx.beginPath();
        for (let i = 0; i <= Math.PI * 2 + 0.1; i += 0.3) {
          // Slightly bumpier rind texture
          const r = f.size + Math.sin(i * 7) * (f.size * 0.05);
          if (i === 0) ctx.moveTo(r, 0); else ctx.lineTo(Math.cos(i) * r, Math.sin(i) * r);
        }
        ctx.closePath();
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;
        ctx.shadowColor = 'transparent';

        // More pronounced shading on the flesh
        const fleshGrad = ctx.createRadialGradient(-f.size*0.1, -f.size*0.1, 0, 0, 0, f.size * 0.9);
        fleshGrad.addColorStop(0, '#ffffff'); // Bright white center highlight
        fleshGrad.addColorStop(0.4, '#e0f7e6'); // Pale green mid-tone
        fleshGrad.addColorStop(0.8, '#a3e0b8'); // Solid cucumber flesh color
        fleshGrad.addColorStop(1, '#5db37a'); // Darker inner shadow near the rind
        ctx.fillStyle = fleshGrad;
        ctx.beginPath();
        ctx.arc(0, 0, f.size * 0.88, 0, Math.PI * 2);
        ctx.fill();

        // Shaded seed cavities
        for (let i = 0; i < 3; i++) {
          const angle = (Math.PI * 2 / 3) * i;
          ctx.save();
          ctx.rotate(angle);
          
          // Cavity background with inner shadow
          const cavityGrad = ctx.createRadialGradient(f.size * 0.35, 0, 0, f.size * 0.35, 0, f.size * 0.25);
          cavityGrad.addColorStop(0, 'rgba(150, 210, 170, 0.4)'); // Translucent center
          cavityGrad.addColorStop(1, 'rgba(100, 180, 130, 0.8)'); // Darker edge for depth

          ctx.fillStyle = cavityGrad;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(f.size * 0.3, f.size * 0.25, f.size * 0.6, f.size * 0.35, f.size * 0.5, 0);
          ctx.bezierCurveTo(f.size * 0.6, -f.size * 0.35, f.size * 0.3, -f.size * 0.25, 0, 0);
          ctx.fill();

          // Seeds with slight drop shadows
          ctx.shadowColor = 'rgba(0,0,0,0.2)';
          ctx.shadowBlur = 2;
          ctx.shadowOffsetY = 1;
          ctx.fillStyle = '#fffff0'; // Slightly off-white seeds
          ctx.beginPath();
          ctx.ellipse(f.size * 0.35, f.size * 0.12, f.size * 0.08, f.size * 0.04, 0.3, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(f.size * 0.35, -f.size * 0.12, f.size * 0.08, f.size * 0.04, -0.3, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        ctx.restore();
      });

      // 4. Waves
      gameState.waves = gameState.waves.filter(w => w.age < w.life);
      gameState.waves.forEach(w => {
        w.age += dt;
        const prog = w.age / w.life;
        const radius = 10 + (w.age * w.speed);
        const alpha = 1 - prog;
        
        ctx.beginPath();
        ctx.arc(w.x, w.y, radius, 0, Math.PI * 2);
        ctx.lineWidth = 4 * alpha;
        ctx.strokeStyle = `rgba(180, 230, 255, ${alpha * 0.5})`;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(w.x, w.y, radius + 15 * prog, 0, Math.PI * 2);
        ctx.lineWidth = 2 * alpha;
        ctx.strokeStyle = `rgba(100, 200, 255, ${alpha * 0.3})`;
        ctx.stroke();
      });

      // 5. Turtles
      turtles.forEach(t => {

        let isAvoidingEdge = false;
        let foundFood = false;
        let scaredByWave = false;


        // Check for nearby waves and scare turtles away (ignore waves created by food drops)
        let nearestWaveDist = Infinity;
        let nearestWave = null;
        gameState.waves.forEach(w => {
          if (w.source === 'food') return; // don't let food-drop waves scare turtles
          const dist = Math.hypot(w.x - t.x, w.y - t.y);
          if (dist < nearestWaveDist) {
            nearestWaveDist = dist;
            nearestWave = w;
          }
        });
        if (nearestWave && nearestWaveDist < 120) {
          scaredByWave = true;
          t.targetAngle = Math.atan2(t.y - nearestWave.y, t.x - nearestWave.x);
          t.speed = t.baseSpeed * 3.5;
        }

        if (!scaredByWave && gameState.food.length > 0) {
          let nearestFood = null;
          let nearestDist = Infinity;
          gameState.food.forEach((f, index) => {
            const dist = Math.hypot(f.x - t.x, f.y - t.y);
            if (dist < nearestDist) {
              nearestDist = dist;
              nearestFood = { f, index };
            }
          });
          if (nearestFood && nearestDist < 1200) {
            foundFood = true;
            t.targetAngle = Math.atan2(nearestFood.f.y - t.y, nearestFood.f.x - t.x);
            t.speed = t.baseSpeed * 4.5;
            if (nearestDist < 60 * t.scaleMult) {
               gameState.food.splice(nearestFood.index, 1);
            }
          }
        }

        if (!foundFood) t.speed = t.baseSpeed;

        if (!foundFood && Math.random() < 0.01 * dt) {
          t.targetAngle += (Math.random() - 0.5) * Math.PI;
        }
        

        // Reduce margin so turtles can wander farther off screen
        const marginX = Math.min(width * 0.05, 44 * t.scaleMult);
        const marginY = Math.min(height * 0.05, 44 * t.scaleMult);

        // Only avoid edges when not actively pursuing food; allow small off-screen roaming while chasing
        if (!foundFood && (t.x < marginX || t.x > width - marginX || t.y < marginY || t.y > height - marginY)) {
          isAvoidingEdge = true;
          t.targetAngle = Math.atan2((height / 2) - t.y, (width / 2) - t.x);
        }

        let diff = t.targetAngle - t.angle;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        
        t.angle += diff * (isAvoidingEdge ? 0.08 : (foundFood ? 0.07 : 0.015)) * dt;
        t.x += Math.cos(t.angle) * t.speed * dt;
        t.y += Math.sin(t.angle) * t.speed * dt;


        // Increase negative padding so turtles can go off screen by about 20%
        // Allow turtles to wander slightly off-screen to reach near-edge food, but not disappear.
        // Track offscreen time and nudge turtles back if they're gone too long.
        const padding = Math.max(width, height) * 0.12 * -1;
        t.x = Math.max(padding, Math.min(width - padding, t.x));
        t.y = Math.max(padding, Math.min(height - padding, t.y));

        // Offscreen timeout logic: if turtle is outside visible bounds, increment timer
        const isVisible = t.x >= 0 && t.x <= width && t.y >= 0 && t.y <= height;
        if (!isVisible) {
          t.offscreenTime = (t.offscreenTime || 0) + dt;
        } else {
          t.offscreenTime = 0;
        }

        // If a turtle has been offscreen for too long, more forcefully return it to visible area
        if (t.offscreenTime > 60) { // ~1 second
          // Clamp turtle to a safe visible area (5% inset) so it won't disappear
          const insetX = Math.max(20, width * 0.05);
          const insetY = Math.max(20, height * 0.05);
          t.x = Math.max(insetX, Math.min(width - insetX, t.x));
          t.y = Math.max(insetY, Math.min(height - insetY, t.y));

          // Snap its angle toward center and boost speed so it visibly returns
          t.targetAngle = Math.atan2((height / 2) - t.y, (width / 2) - t.x);
          t.angle = t.targetAngle;
          t.speed = t.baseSpeed * 2.0;
          t.offscreenTime = 0; // reset after repositioning
        }

        drawRealisticTurtle(ctx, time, width, height, t);
      });

      // 6. Particles
      particles.forEach(p => {
        p.y -= p.speed * dt;
        p.x += Math.sin(time * 0.001 + p.offset) * 0.4 * dt;
        if (p.y < -20) { p.y = height + 20; p.x = Math.random() * width; }
        ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });

      requestAnimationFrame(render);
    }
    
    requestAnimationFrame(render);

    // --- Interactive Input Handlers ---
    const handlePointerDown = (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      gameState.pointerActive = true;
      gameState.lastX = x;
      gameState.lastY = y;

      // Clamp food drop position to turtles' reachable area
      const foodPadding = Math.min(canvas.width * 0.2, canvas.height * 0.2, 180);
      const clampedX = Math.max(foodPadding * -1, Math.min(canvas.width + foodPadding, x));
      const clampedY = Math.max(foodPadding * -1, Math.min(canvas.height + foodPadding, y));
      if (mode === 'food') {
        gameState.food.push({ x: clampedX, y: clampedY, size: 0, targetSize: 7, rot: Math.random() * Math.PI * 2 });
        // mark waves created by food drops so turtles won't be scared by them
        gameState.waves.push({ x: clampedX, y: clampedY, age: 0, life: 60, speed: 1.5, source: 'food' });
      } else {
        gameState.waves.push({ x, y, age: 0, life: 100, speed: 2.5, source: 'water' });
      }
    };

    const handlePointerMove = (e) => {
      if (!gameState.pointerActive || mode !== 'water') return;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      const dx = x - gameState.lastX;
      const dy = y - gameState.lastY;
      if (Math.hypot(dx, dy) > 25) {
        gameState.waves.push({ x, y, age: 0, life: 80, speed: 2 });
        gameState.lastX = x;
        gameState.lastY = y;
      }
    };

    const handlePointerUp = () => { gameState.pointerActive = false; };

    canvas.addEventListener('pointerdown', handlePointerDown);
    canvas.addEventListener('pointermove', handlePointerMove);
    canvas.addEventListener('pointerup', handlePointerUp);
    canvas.addEventListener('pointerleave', handlePointerUp);

  </script>
</body>
</html>
